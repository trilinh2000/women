<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi yêu thương 💌</title>
<style>
body {
  margin:0;
  padding:0;
  overflow:hidden;
  height:100vh;
  background: linear-gradient(to bottom, #ffe4ec, #fff);
  font-family: "Segoe UI", sans-serif;
  color:#ff3399;
  text-align:center;
}

/* 🐶 Chó + đám mây */
.dog-group {
  position:absolute;
  top:60%;
  left:-400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  animation: moveAcross 8s linear forwards;
}
.thought-cloud {
  width:260px;
  max-width:26vw;
  height:150px;
  max-height:15vh;
  background:url("style/image/cloud.png") no-repeat center bottom;
  background-size:contain;
  display:flex;
  align-items:center;
  justify-content:center;
  animation: floatUp 1.5s ease-in-out infinite alternate;
  transform: scaleX(-1);
}
.thought-text {
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%) scaleX(-1);
  text-align:center;
  font-weight:600;
  color:#ff4fa3;
  width:80%;
  word-wrap: break-word;
  font-size: clamp(16px, 4vw, 24px);
}

#dog { width:240px; max-width:24vw; transform:scaleX(-1); }

@keyframes moveAcross {
  0% { left:-400px; }
  100% { left:calc(50% - 120px); }
}
@keyframes floatUp {
  from { transform: scaleX(-1) translateY(0); }
  to { transform: scaleX(-1) translateY(-10px); }
}

#message {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  display:flex;
  flex-wrap: wrap;
  justify-content:center;
  align-items:flex-start;
  overflow:hidden;
  padding:5px;
  box-sizing:border-box;
}

.love-item {
  position:relative;
  opacity:0;
  text-align:center;
  transition: opacity 0.5s ease;
  word-break: break-word;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:5px;
  aspect-ratio:1/1; /* đảm bảo container vuông */
}

.love-item img {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:10px;
}

.love-item .text {
  margin-top:5px;
  color:#ff0066;
  font-weight:600;
  font-size: clamp(12px, 3vw, 18px);
  word-wrap:break-word;
  text-align:center;
}

/* Desktop: 4 cột */
@media(min-width:1025px){
  .love-item { flex: 1 1 calc(25% - 10px); max-width: calc(25% - 10px); }
}
/* Tablet: 3 cột */
@media(min-width:769px) and (max-width:1024px){
  .love-item { flex: 1 1 calc(33.33% - 10px); max-width: calc(33.33% - 10px); }
}
/* Mobile: 2 cột */
@media(max-width:768px){
  .thought-cloud { width:50vw; height:20vh; }
  #dog { width:40vw; }
  .love-item { flex: 1 1 calc(50% - 5px); max-width: calc(50% - 5px); margin:2px; }
  .love-item .text { font-size:3vw; }
}
</style>
</head>
<body>

<div class="dog-group" id="dogGroup">
  <div class="thought-cloud">
    <div class="thought-text">
      Dịch vụ gửi thư yêu thương 💖 <br>💌
    </div>
  </div>
  <img id="dog" src="style/image/ship.gif" alt="chó dễ thương">
</div>

<div id="message"></div>
<audio id="sound" src="style/sound/love.mp3"></audio>

<script>
const dogGroup = document.getElementById("dogGroup");
const message = document.getElementById("message");
const sound = document.getElementById("sound");

const loveTexts = [
  "💖 Gặp cậu là điều tuyệt vời nhất hôm nay!",
  "💌 Nhìn cậu thôi cũng thấy tim mình rung rinh!",
  "🌸 Chúc cậu ngày 20/10 tràn đầy nụ cười và ngọt ngào như cậu vậy!",
  "💘 Ai đó đáng yêu như cậu phải được cưng chiều hết nấc!",
  "🌷 Một ngày xinh đẹp, một trái tim rung rinh 💕",
  "💝 Cậu khiến mọi thứ xung quanh trở nên đáng yêu hơn!",
  "💫 Nếu cậu cười, cả thế giới mình cũng muốn cười theo!"
];

let loveImages = [
  "./style/image/chuc1.jpg",
  "./style/image/chuc2.jpg",
  "./style/image/chuc3.jpg",
  "./style/image/chuc4.jpg",
  "./style/image/chuc5.jpg",
  "./style/image/chuc6.jpg",
];

dogGroup.addEventListener("animationend", () => {
  dogGroup.style.display = "none";
  sound.currentTime = 0;
  sound.play();

  loveImages.forEach((imgSrc,index)=>{
    setTimeout(()=>{
      const item = document.createElement("div");
      item.className="love-item";

      const img = document.createElement("img");
      img.src = imgSrc;
      item.appendChild(img);

      const text = document.createElement("div");
      text.className="text";
      text.innerText = loveTexts[index % loveTexts.length];
      item.appendChild(text);

      message.appendChild(item);
      requestAnimationFrame(()=>item.style.opacity=1);
    }, index*500);
  });
});
</script>
</body>
</html>
