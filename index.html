<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi yêu thương 💌</title>
<style>
body {
  margin:0;
  padding:0;
  overflow:hidden;
  height:100vh;
  background: linear-gradient(to bottom, #ffe4ec, #fff);
  font-family: "Segoe UI", sans-serif;
  color:#ff3399;
  text-align:center;
}

/* 🐶 Chó + đám mây */
.dog-group {
  position:absolute;
  top:60%;
  left:-400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  animation: moveAcross 8s linear forwards;
}
.thought-cloud {
  width:260px;
  max-width:50vw;
  height:150px;
  max-height:20vh;
  background:url("style/image/cloud.png") no-repeat center bottom;
  background-size:contain;
  display:flex;
  align-items:center;
  justify-content:center;
  animation: floatUp 1.5s ease-in-out infinite alternate;
  transform: scaleX(-1);
}
.thought-text {
  position: relative; /* nằm trong đám mây */
  transform: scaleX(-1);
  text-align: center;
  font-weight:600;
  color:#ff4fa3;
  width:90%;
  max-width:260px;
  word-wrap: break-word;
  font-size: clamp(12px,4vw,18px);
}

#dog { width:240px; max-width:24vw; transform:scaleX(-1); }

@keyframes moveAcross {
  0% { left:-400px; }
  100% { left:calc(50% - 120px); }
}
@keyframes floatUp {
  from { transform: scaleX(-1) translateY(0); }
  to { transform: scaleX(-1) translateY(-10px); }
}

/* 💘 Lời chúc full màn hình */
#message {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  display:flex;
  flex-wrap: wrap;
  justify-content: center;
  align-content: center;
}

/* ❤️ Item ảnh + chữ */
.love-item {
  position: relative;
  opacity:0;
  text-align:center;
  margin:10px;
  transition: opacity 1s ease;
  display:flex;
  flex-direction: column;
  align-items: center;
}
.love-item img {
  display:block;
  width:100%;
  height:auto;
  border-radius:10px;
}
.love-item .text {
  margin-top:5px;
  color:#ff0066;
  font-weight:600;
  text-align:center;
  font-size: clamp(12px,3vw,18px);
  word-wrap:break-word;
}

/* Mobile */
@media(max-width:768px){
  .thought-cloud { width:50vw; height:20vh; }
  #dog { width:40vw; }
}
</style>
</head>
<body>

<div class="dog-group" id="dogGroup">
  <div class="thought-cloud">
    <div class="thought-text">
      Dịch vụ gửi thư yêu thương 💖 <br>💌
    </div>
  </div>
  <img id="dog" src="style/image/ship.gif" alt="chó dễ thương">
</div>

<div id="message"></div>
<audio id="sound" src="style/sound/love.mp3"></audio>

<script>
const dogGroup = document.getElementById("dogGroup");
const message = document.getElementById("message");
const sound = document.getElementById("sound");

// Lời chúc
const loveTexts = [
  "💖 Gặp cậu là điều tuyệt vời nhất hôm nay!",
  "💌 Nhìn cậu thôi cũng thấy tim mình rung rinh!",
  "🌸 Chúc cậu ngày 20/10 tràn đầy nụ cười và ngọt ngào như cậu vậy!",
  "💘 Ai đó đáng yêu như cậu phải được cưng chiều hết nấc!",
  "🌷 Một ngày xinh đẹp, một trái tim rung rinh 💕",
  "💝 Cậu khiến mọi thứ xung quanh trở nên đáng yêu hơn!",
  "💫 Nếu cậu cười, cả thế giới mình cũng muốn cười theo!"
];

// Ảnh
let loveImages = [
  "./style/image/chuc1.jpg",
  "./style/image/chuc2.jpg",
  "./style/image/chuc3.jpg",
  "./style/image/chuc4.jpg",
  "./style/image/chuc5.jpg",
  "./style/image/chuc6.jpg"
];

dogGroup.addEventListener("animationend", () => {
  dogGroup.style.display = "none";
  sound.currentTime = 0;
  sound.play();

  // Shuffle để hiển thị ảnh ngẫu nhiên nhưng không trùng
  loveImages = loveImages.sort(()=>Math.random()-0.5);

  loveImages.forEach((imgSrc,index)=>{
    setTimeout(()=>{
      const item = document.createElement("div");
      item.className="love-item";

      const img = document.createElement("img");
      img.src = imgSrc;
      const size = Math.min(100 + Math.random()*50, 200);
      img.style.width = size + "px";
      img.style.height = "auto";
      item.appendChild(img);

      const text = document.createElement("div");
      text.className="text";
      text.innerText = loveTexts[Math.floor(Math.random()*loveTexts.length)];
      item.appendChild(text);

      message.appendChild(item);
      requestAnimationFrame(()=>item.style.opacity=1);
    }, index*500);
  });
});
</script>
</body>
</html>
